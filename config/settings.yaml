# RMSD Analysis
datasets:                                           # file_name : path
  'MD1': /data/raw/RMSD/MD1_BvPIP2.1.csv
  'MD2': /data/raw/RMSD/MD2_BvPIP2.1.csv
  'MD3': /data/raw/RMSD/MD3_BvPIP2.1.csv

analysis_parameters:
    feature_columns: ['RMSD']
    y_columns: ['RMSD_MD1', 'RMSD_MD2', 'RMSD_MD3']
    x_column: 'Frame'
    hyperparameters:
      n_estimators: 100
      max_depth: 5