# -*- coding: utf-8 -*-
## This file contains given dataset names and paths for the raw data for each analysis.  
## Each dataset has a default mode which can be changed to ensure numbers are correctly 
## transferred from the raw files to the Python datasets. 
## This file also defines which parameters and columns should be considered for later 
## processing and plotting. 

## Model: BvPIP2.1
## Raw data: Server Dario version 05_08_2026 (no todavia)


# RMSD Analysis

analysis_name: RMSD
default_mode: float

datasets:                                           # file_name : path
  'MD1': ../../data/raw/RMSD/MD1_BvPIP2.1.csv
  'MD2': ../../data/raw/RMSD/MD2_BvPIP2.1.csv
  'MD3': ../../data/raw/RMSD/MD3_BvPIP2.1.csv

analysis_parameters:
    feature_columns: ['RMSD']
    y_columns: ['RMSD_MD1', 'RMSD_MD2', 'RMSD_MD3']
    x_column: 'Frame'
    hyperparameters:
      n_estimators: 100
      max_depth: 5

